# ─────────────────────────────────────────────────────────────────────────────
# SOURCE OF TRUTH: petry-projects/.github/standards/workflows/sonarcloud.yml
# Standard:        petry-projects/.github/standards/ci-standards.md#3-sonarcloud-analysis
#
# ADOPTING THIS WORKFLOW:
#   1. This ships verbatim into repos created from petry-projects/repo-template.
#   2. Set sonar.projectKey / sonar.organization in sonar-project.properties to
#      match your repo (see BOOTSTRAP.md), and add the SONAR_TOKEN repo secret.
#   3. The job name `SonarCloud` is the required status check — keep it.
#   4. The scan is guarded on SONAR_TOKEN, so the job is a green no-op until the
#      secret is set — a fresh repo is not blocked on day 0.
#
# CONVENTIONS (enforced by the standard):
#   • permissions: {} at top, least-privilege per job (contents + pull-requests: read)
#   • triggers: push + pull_request to main; checkout with fetch-depth: 0
#   • first scan is continue-on-error with a single retry (SonarCloud's analysis
#     endpoint is occasionally flaky); a short backoff (sleep) precedes the retry
#     so a transient blip has time to clear instead of failing both attempts
#     back-to-back (Fleet Monitor #447)
#   • SHA-pin every third-party action (never a tag/branch)
# ─────────────────────────────────────────────────────────────────────────────
name: SonarCloud Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

# Scope the concurrency group to the commit SHA so every pushed commit gets its
# own slot (Fleet Monitor #445; mirrors the ci.yml #380 fix). A per-ref group
# with cancel-in-progress cancels an in-progress run for an earlier commit the
# moment a newer commit lands on the same ref, so quick-succession pushes leave
# earlier commits cancelled — the cancelled runs that inflated this workflow's
# instability metric. Including github.sha gives each commit a distinct slot, so
# no commit is cancelled by a later one. cancel-in-progress: true still cancels
# duplicate runs for the same ref + SHA, but cannot cancel runs for different
# commits because their groups are distinct.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        id: setup_java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: SonarCloud Scan
        id: sonar
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        continue-on-error: true
      - name: Back off before retry
        if: env.SONAR_TOKEN != '' && steps.sonar.outcome == 'failure'
        run: sleep 30
      - name: SonarCloud Scan (retry)
        if: env.SONAR_TOKEN != '' && steps.sonar.outcome == 'failure'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
