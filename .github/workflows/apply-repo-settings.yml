# ─────────────────────────────────────────────────────────────────────────────
# Standard: petry-projects/.github/standards/push-protection.md#required-repo-level-settings
#
# Applies repository-level settings via scripts/apply-repo-settings.sh on every
# push to main and on a weekly schedule (Mon 03:00 UTC) so that settings
# documented in .github/settings.yml stay in effect and drift is caught between
# compliance audits. Also triggerable manually for out-of-band remediation.
# Reconciles: security_and_analysis settings (secret_scanning_ai_detection, etc.),
# check-suite auto-trigger preferences, and the pr-quality ruleset's
# allowed_merge_methods (squash-only), dismiss_stale_reviews_on_push (true), and
# require_last_push_approval (true).
#
# Token: GH_PAT_WORKFLOWS (classic PAT with repo scope).
# `administration` is not a valid GITHUB_TOKEN scope in Actions; and the
# check-suites/preferences endpoint requires a classic PAT (OAuth tokens are
# rejected). See standards/github-settings.md#check-suite-auto-trigger-preferences.
# ─────────────────────────────────────────────────────────────────────────────
name: Apply repo settings

on:
  push:
    branches: [main]
    paths:
      - .github/settings.yml
      - scripts/apply-repo-settings.sh
      - .github/workflows/apply-repo-settings.yml
  schedule:
    # Reinforce settings weekly (Mon 03:00 UTC) so drift is caught between compliance audits.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: apply-repo-settings
  cancel-in-progress: false

jobs:
  apply:
    name: Apply repo settings
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # Pinned to SHA per Action Pinning Policy
        # (petry-projects/.github/standards/ci-standards.md#action-pinning-policy).
        # Refresh: gh api repos/actions/checkout/git/refs/tags/v6.0.2 --jq '.object.sha'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Apply settings
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_WORKFLOWS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/apply-repo-settings.sh
